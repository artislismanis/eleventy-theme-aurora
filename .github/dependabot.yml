version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Runtime deps ship to consumers of the theme — reviewed on their own.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev-toolchain:
        dependency-type: development
        update-types: [minor, patch]
      # eslint and @eslint/js release in lockstep; ungrouped majors let one land
      # without the other, which leaves package.json unresolvable.
      eslint:
        patterns: ['eslint', '@eslint/js']
    # Other majors stay ungrouped so each arrives as its own reviewable PR.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
