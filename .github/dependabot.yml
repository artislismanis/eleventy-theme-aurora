version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      # Fortnightly isn't a Dependabot interval and cron can't express "every
      # other Monday" (day-of-week steps silently run weekly), so this fires on
      # the 1st and 15th of each month instead.
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: Europe/London
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Runtime deps ship to consumers of the theme — reviewed on their own.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev-toolchain:
        dependency-type: development
        update-types: [minor, patch]
      # eslint and @eslint/js release in lockstep; ungrouped majors let one land
      # without the other, which leaves package.json unresolvable.
      eslint:
        patterns: ['eslint', '@eslint/js']
    # Other majors stay ungrouped so each arrives as its own reviewable PR.

    # Patch bumps are ignored outright. `update-types` rules apply to version
    # updates only, so Dependabot security updates still raise patch-level PRs.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
    # Patch bumps are ignored outright. `update-types` rules apply to version
    # updates only, so Dependabot security updates still raise patch-level PRs.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
