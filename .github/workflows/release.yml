name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm auth is Trusted Publishing (OIDC): npm verifies this workflow's
      # identity against the trusted publisher registered on the package, so
      # there is no NPM_TOKEN to expire or leak. Requires npm >= 11.5.1;
      # Node 24 ships npm 11.19.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          # OIDC needs this to target the registry, even with no token.
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm ci --no-audit --no-fund

      # CI covers main, but a tag can point at any commit. npm releases are
      # immutable, so re-run the gates against the exact tagged tree.
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

      # A tag that disagrees with package.json ships the wrong version under a
      # name that can never be reused. Fail before publish, not after.
      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
